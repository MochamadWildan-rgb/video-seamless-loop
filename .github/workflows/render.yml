# Nama workflow yang akan muncul di tab Actions GitHub
name: Render Remotion Video

on:
  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:
    inputs:
      compositionId:
        description: 'ID Komposisi yang akan dirender'
        required: true
        default: 'CubesLayer'
      crf:
        description: 'Kualitas CRF (0-51, lebih rendah lebih baik)'
        required: true
        default: '23'

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    # Menambahkan izin untuk menulis ke Actions, diperlukan untuk beberapa fitur Remotion
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Ganti 'src/index.ts' jika file entri Remotion Anda berbeda.
      # 'TechBackground' adalah ID komposisi Anda.
      # 'out/video.mp4' adalah file output.
      - name: Render video
        run: npx remotion render src/index.ts ${{ github.event.inputs.compositionId }} out/video.mp4 --crf=${{ github.event.inputs.crf }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4